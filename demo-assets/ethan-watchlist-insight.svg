<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">The update, with the “so what?”</title><desc id="desc">A hypothetical company reports higher sales and faster-rising costs. The insight explains that keeping less profit from each sale could weaken the investment case. Illustrative workflow using a hypothetical company, not a live account.</desc>
<defs><radialGradient id="glow" cx="90%" cy="0%" r="85%"><stop stop-color="#49391b"/><stop offset="1" stop-color="#161715"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#glow)"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="48" y="45" font-size="19" fill="#fcd34d" font-weight="700">ETHAN / BEGINNER INVESTOR</text><text x="925" y="45" font-size="20" fill="#c7bfac" font-weight="400">Illustrative workflow</text>
<text x="48" y="105" font-size="43" fill="#fff8e8" font-weight="700">The update, with the “so what?”</text><text x="48" y="146" font-size="23" fill="#c7bfac" font-weight="400">A hypothetical Watchlist insight connects the news to his investment.</text>
<path d="M48 174H1152" stroke="#494233"/>
<rect x="48" y="206" width="446" height="304" rx="18" fill="#24221d" stroke="#484235"/><rect x="526" y="206" width="626" height="304" rx="18" fill="#30291b" stroke="#806b32"/><text x="76" y="247" font-size="18" fill="#fcd34d" font-weight="700">THE COMPANY UPDATE</text><text x="76" y="308" font-size="30" fill="#9be2bc" font-weight="600">Sales are growing</text><text x="76" y="365" font-size="28" fill="#fcd34d" font-weight="600">Costs are growing faster</text><text x="76" y="430" font-size="24" fill="#c7bfac" font-weight="400">Both facts matter to</text><text x="76" y="466" font-size="24" fill="#c7bfac" font-weight="400">the company Ethan follows.</text><text x="554" y="247" font-size="18" fill="#fcd34d" font-weight="700">WHAT IT MEANS TO HIM</text><text x="554" y="309" font-size="30" fill="#fff8e8" font-weight="700">More sales. Less profit per sale.</text><text x="554" y="370" font-size="25" fill="#c7bfac" font-weight="400">The business is growing, but it is keeping</text><text x="554" y="411" font-size="25" fill="#c7bfac" font-weight="400">less of each sale after paying its costs.</text><text x="554" y="452" font-size="25" fill="#c7bfac" font-weight="400">That could weaken the reason he invested.</text><rect x="48" y="540" width="1104" height="74" rx="14" fill="#332b18" stroke="#806b32"/><text x="70" y="570" font-size="18" fill="#fcd34d" font-weight="700">A QUESTION WORTH FOLLOWING</text><text x="70" y="598" font-size="24" fill="#fff8e8" font-weight="500">Does the company expect its costs to settle as the business grows?</text><rect x="48" y="641" width="34" height="4" rx="2" fill="#fcd34d" stroke="none"/><rect x="94" y="641" width="34" height="4" rx="2" fill="#fcd34d" stroke="none"/><rect x="140" y="641" width="34" height="4" rx="2" fill="#fcd34d" stroke="none"/><rect x="186" y="641" width="34" height="4" rx="2" fill="#fcd34d" stroke="none"/><rect x="232" y="641" width="34" height="4" rx="2" fill="#fcd34d" stroke="none"/><rect x="278" y="641" width="34" height="4" rx="2" fill="#474132" stroke="none"/><text x="350" y="650" font-size="18" fill="#c7bfac" font-weight="400">DISCOVER   /   UNDERSTAND   /   TRADE   /   STAY INFORMED</text>
</g></svg>