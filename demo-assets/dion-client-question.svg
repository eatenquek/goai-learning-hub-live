<text x="48" y="105" font-size="43" fill="#eefdf9" font-weight="700">Every preference has a place in the advice.</text><text x="48" y="146" font-size="23" fill="#b0c7c2" font-weight="400">GoAI carries the client context forward from previous conversations.</text>
