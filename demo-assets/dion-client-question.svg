<title id="title">Every preference has a place in the advice.</title><desc id="desc">Illustrative saved preferences: long-term growth, moderate risk, SGD spending, a home deposit in 18 months, and limited technology exposure. Dion confirms the profile when the client asks about Nebius (NBIS). Illustrative workflow, not a live client record or investment recommendation.</desc>
<metadata>Company research background: https://www.sec.gov/Archives/edgar/data/1513845/000110465926052948/nbis-20251231x20f.htm and https://www.sec.gov/Archives/edgar/data/1513845/000110465926094844/nbis-20260812xex99d1.htm. Client circumstances and downside scenarios are fictional.</metadata>
