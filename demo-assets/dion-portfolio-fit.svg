<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">The details that change the recommendation.</title><desc id="desc">Hypothetical checks: shared AI-cycle exposure, an 18-month home-deposit cash need, USD versus SGD, and a 40% NBIS decline with losses in other holdings. The stress scenario is not a forecast or a maximum possible loss. Illustrative workflow, not a live client record or investment recommendation.</desc>
<metadata>Company research background: https://www.sec.gov/Archives/edgar/data/1513845/000110465926052948/nbis-20251231x20f.htm and https://www.sec.gov/Archives/edgar/data/1513845/000110465926094844/nbis-20260812xex99d1.htm. Client circumstances and downside scenarios are fictional.</metadata>
<defs><radialGradient id="glow" cx="90%" cy="0%" r="85%"><stop stop-color="#16483e"/><stop offset="1" stop-color="#131b1c"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#glow)"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="48" y="45" font-size="19" fill="#5eead4" font-weight="700">DION / CLIENT ADVISORY</text><text x="925" y="45" font-size="20" fill="#b0c7c2" font-weight="400">Illustrative workflow</text>
<text x="48" y="105" font-size="43" fill="#eefdf9" font-weight="700">The details that change the recommendation.</text><text x="48" y="146" font-size="23" fill="#b0c7c2" font-weight="400">Four illustrative checks beyond the NBIS company story.</text>
<path d="M48 174H1152" stroke="#36524e"/>
<rect x="48" y="206" width="536" height="140" rx="18" fill="#1b2a28" stroke="#36524e"/><text x="72" y="244" font-size="26" fill="#5eead4" font-weight="700">01 / Shared AI exposure</text><text x="72" y="288" font-size="22" fill="#b0c7c2" font-weight="400">Could NBIS, NVIDIA, and TSMC fall together</text><text x="72" y="320" font-size="22" fill="#b0c7c2" font-weight="400">if the AI spending cycle slows?</text><rect x="616" y="206" width="536" height="140" rx="18" fill="#1b2a28" stroke="#36524e"/><text x="640" y="244" font-size="26" fill="#5eead4" font-weight="700">02 / Upcoming cash needs</text><text x="640" y="288" font-size="22" fill="#b0c7c2" font-weight="400">The home deposit is due in 18 months.</text><text x="640" y="320" font-size="22" fill="#b0c7c2" font-weight="400">Keep that money outside this proposal.</text><rect x="48" y="366" width="536" height="140" rx="18" fill="#1b2a28" stroke="#36524e"/><text x="72" y="404" font-size="26" fill="#5eead4" font-weight="700">03 / Currency exposure</text><text x="72" y="448" font-size="22" fill="#b0c7c2" font-weight="400">NBIS trades in USD; the client spends in SGD.</text><text x="72" y="480" font-size="22" fill="#b0c7c2" font-weight="400">USD weakness could reduce the SGD return.</text><rect x="616" y="366" width="536" height="140" rx="18" fill="#1b2a28" stroke="#36524e"/><text x="640" y="404" font-size="26" fill="#5eead4" font-weight="700">04 / Combined downside</text><text x="640" y="448" font-size="22" fill="#b0c7c2" font-weight="400">Stress-test a hypothetical 40% NBIS fall</text><text x="640" y="480" font-size="22" fill="#b0c7c2" font-weight="400">alongside losses in the existing holdings.</text><rect x="48" y="540" width="1104" height="74" rx="14" fill="#193b35" stroke="#3e8174"/><text x="70" y="570" font-size="18" fill="#5eead4" font-weight="700">SCENARIO, NOT A FORECAST OR A LOSS LIMIT</text><text x="70" y="598" font-size="24" fill="#eefdf9" font-weight="500">Dion checks the combined portfolio impact against the client’s tolerance for losses.</text><rect x="48" y="641" width="34" height="4" rx="2" fill="#5eead4" stroke="none"/><rect x="94" y="641" width="34" height="4" rx="2" fill="#5eead4" stroke="none"/><rect x="140" y="641" width="34" height="4" rx="2" fill="#5eead4" stroke="none"/><rect x="186" y="641" width="34" height="4" rx="2" fill="#5eead4" stroke="none"/><rect x="232" y="641" width="34" height="4" rx="2" fill="#344c47" stroke="none"/><rect x="278" y="641" width="34" height="4" rx="2" fill="#344c47" stroke="none"/><text x="350" y="650" font-size="18" fill="#b0c7c2" font-weight="400">REMEMBER   /   RESEARCH   /   PERSONALISE   /   REASSESS</text>
</g></svg>