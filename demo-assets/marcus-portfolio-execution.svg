<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">From research to execution.</title><desc id="desc">Illustrative trade record: a sell order reduces Holding A and a buy order adds selected Candidate A. Broker fill confirmations update the portfolio. Illustrative workflow, not a live account.</desc>
<defs><radialGradient id="glow" cx="90%" cy="0%" r="80%"><stop stop-color="#3b285c"/><stop offset="1" stop-color="#12141e"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#glow)"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="48" y="45" font-size="19" fill="#c4b5fd" font-weight="700">MARCUS / PORTFOLIO AGENT</text><text x="925" y="45" font-size="20" fill="#b7b5c9" font-weight="400">Illustrative workflow</text>
<text x="48" y="105" font-size="43" fill="#f4f1ff" font-weight="700">From research to execution.</text><text x="48" y="146" font-size="23" fill="#b7b5c9" font-weight="400">The agent carries out the portfolio adjustment within Marcus’s mandate.</text>
<path d="M48 174H1152" stroke="#484158"/><rect x="48" y="206" width="532" height="304" rx="18" fill="#20202e" stroke="#39364c"/><rect x="620" y="206" width="532" height="304" rx="18" fill="#262037" stroke="#665286"/><text x="76" y="246" font-size="18" fill="#f5bb82" font-weight="700">REDUCE EXPOSURE</text><text x="648" y="246" font-size="18" fill="#c4b5fd" font-weight="700">ALLOCATE TO THE SELECTED PICK</text><text x="76" y="306" font-size="36" fill="#f4f1ff" font-weight="700">Holding A</text><text x="648" y="306" font-size="36" fill="#f4f1ff" font-weight="700">Candidate A</text><text x="76" y="356" font-size="28" fill="#b7b5c9" font-weight="400">Sell order</text><text x="648" y="356" font-size="28" fill="#b7b5c9" font-weight="400">Buy order</text><rect x="76" y="386" width="112" height="35" rx="17" fill="#172b29" stroke="#32544b"/><text x="92" y="410" font-size="19" fill="#83e3c1" font-weight="600">Filled</text><rect x="648" y="386" width="112" height="35" rx="17" fill="#172b29" stroke="#32544b"/><text x="664" y="410" font-size="19" fill="#83e3c1" font-weight="600">Filled</text><text x="76" y="471" font-size="24" fill="#b7b5c9" font-weight="400">Connected broker confirmation</text><text x="648" y="471" font-size="24" fill="#b7b5c9" font-weight="400">Connected broker confirmation</text><rect x="48" y="540" width="1104" height="74" rx="14" fill="#302644" stroke="#6f569e"/><text x="70" y="570" font-size="18" fill="#c4b5fd" font-weight="700">EXECUTION FEEDS THE NEXT ANALYSIS</text><text x="70" y="598" font-size="24" fill="#f4f1ff" font-weight="500">Confirmed fills update holdings, allocations, and available cash.</text><rect x="48" y="641" width="34" height="4" rx="2" fill="#c4b5fd" stroke="none"/><rect x="94" y="641" width="34" height="4" rx="2" fill="#c4b5fd" stroke="none"/><rect x="140" y="641" width="34" height="4" rx="2" fill="#c4b5fd" stroke="none"/><rect x="186" y="641" width="34" height="4" rx="2" fill="#c4b5fd" stroke="none"/><rect x="232" y="641" width="34" height="4" rx="2" fill="#c4b5fd" stroke="none"/><rect x="278" y="641" width="34" height="4" rx="2" fill="#3a364b" stroke="none"/><text x="350" y="650" font-size="18" fill="#b7b5c9" font-weight="400">CONNECT   /   RESEARCH   /   SELECT   /   TRADE   /   MONITOR</text>
</g></svg>