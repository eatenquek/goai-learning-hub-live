<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">He knows what needs his attention.</title><desc id="desc">Ethan can keep monitoring when the reasons still hold, review the position when conditions change, or ask a simple follow-up question. He makes each decision himself. Illustrative workflow using a hypothetical company, not a live account.</desc>
<defs><radialGradient id="glow" cx="90%" cy="0%" r="85%"><stop stop-color="#49391b"/><stop offset="1" stop-color="#161715"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#glow)"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="48" y="45" font-size="19" fill="#fcd34d" font-weight="700">ETHAN / BEGINNER INVESTOR</text><text x="925" y="45" font-size="20" fill="#c7bfac" font-weight="400">Illustrative workflow</text>
<text x="48" y="105" font-size="43" fill="#fff8e8" font-weight="700">He knows what needs his attention.</text><text x="48" y="146" font-size="23" fill="#c7bfac" font-weight="400">New insights stay connected to the trade plan he followed.</text>
<path d="M48 174H1152" stroke="#494233"/>
<rect x="48" y="210" width="352" height="300" rx="18" fill="#24221d" stroke="#484235"/><text x="70" y="252" font-size="17" fill="#fcd34d" font-weight="700">THE REASONS STILL HOLD</text><text x="70" y="310" font-size="27" fill="#fff8e8" font-weight="700">Keep watching</text><text x="70" y="370" font-size="24" fill="#c7bfac" font-weight="400">Follow the next update</text><text x="70" y="408" font-size="24" fill="#c7bfac" font-weight="400">with the original plan</text><text x="70" y="446" font-size="24" fill="#c7bfac" font-weight="400">still in view.</text><rect x="424" y="210" width="352" height="300" rx="18" fill="#24221d" stroke="#484235"/><text x="446" y="252" font-size="17" fill="#fcd34d" font-weight="700">THE OUTLOOK CHANGES</text><text x="446" y="310" font-size="27" fill="#fff8e8" font-weight="700">Review the position</text><text x="446" y="370" font-size="24" fill="#c7bfac" font-weight="400">Revisit the plan if the case</text><text x="446" y="408" font-size="24" fill="#c7bfac" font-weight="400">weakens or an exit</text><text x="446" y="446" font-size="24" fill="#c7bfac" font-weight="400">condition is reached.</text><rect x="800" y="210" width="352" height="300" rx="18" fill="#24221d" stroke="#484235"/><text x="822" y="252" font-size="17" fill="#fcd34d" font-weight="700">SOMETHING IS UNCLEAR</text><text x="822" y="310" font-size="27" fill="#fff8e8" font-weight="700">Ask in plain language</text><text x="822" y="370" font-size="24" fill="#c7bfac" font-weight="400">“Why do higher costs</text><text x="822" y="408" font-size="24" fill="#c7bfac" font-weight="400">matter for the company</text><text x="822" y="446" font-size="24" fill="#c7bfac" font-weight="400">I invested in?”</text><rect x="48" y="540" width="1104" height="74" rx="14" fill="#332b18" stroke="#806b32"/><text x="70" y="570" font-size="18" fill="#fcd34d" font-weight="700">RESEARCH HELPS HIM DECIDE</text><text x="70" y="598" font-size="24" fill="#fff8e8" font-weight="500">Watchlist keeps him informed. Ethan chooses his next move.</text><rect x="48" y="641" width="34" height="4" rx="2" fill="#fcd34d" stroke="none"/><rect x="94" y="641" width="34" height="4" rx="2" fill="#fcd34d" stroke="none"/><rect x="140" y="641" width="34" height="4" rx="2" fill="#fcd34d" stroke="none"/><rect x="186" y="641" width="34" height="4" rx="2" fill="#fcd34d" stroke="none"/><rect x="232" y="641" width="34" height="4" rx="2" fill="#fcd34d" stroke="none"/><rect x="278" y="641" width="34" height="4" rx="2" fill="#fcd34d" stroke="none"/><text x="350" y="650" font-size="18" fill="#c7bfac" font-weight="400">DISCOVER   /   UNDERSTAND   /   TRADE   /   STAY INFORMED</text>
</g></svg>