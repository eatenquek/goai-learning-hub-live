<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Every market change has context.</title><desc id="desc">An illustrative earnings update weakens Holding A’s outlook. The agent researches the company, analyses portfolio exposure and assesses whether a reduction is warranted. Illustrative workflow, not a live account.</desc>
<defs><radialGradient id="glow" cx="90%" cy="0%" r="80%"><stop stop-color="#3b285c"/><stop offset="1" stop-color="#12141e"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#glow)"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="48" y="45" font-size="19" fill="#c4b5fd" font-weight="700">MARCUS / PORTFOLIO AGENT</text><text x="925" y="45" font-size="20" fill="#b7b5c9" font-weight="400">Illustrative workflow</text>
<text x="48" y="105" font-size="43" fill="#f4f1ff" font-weight="700">Every market change has context.</text><text x="48" y="146" font-size="23" fill="#b7b5c9" font-weight="400">A development matters when it changes the investment case or portfolio fit.</text>
<path d="M48 174H1152" stroke="#484158"/><rect x="48" y="200" width="1104" height="88" rx="18" fill="#302622" stroke="#715347"/><text x="72" y="233" font-size="18" fill="#f5bb82" font-weight="700">NEW EARNINGS EVIDENCE</text><text x="72" y="269" font-size="29" fill="#f4f1ff" font-weight="600">Holding A: a weaker profit outlook changes the case.</text><rect x="48" y="316" width="342" height="190" rx="18" fill="#20202e" stroke="#39364c"/><text x="72" y="349" font-size="19" fill="#c4b5fd" font-weight="700">01</text><text x="72" y="391" font-size="27" fill="#f4f1ff" font-weight="700">Company research</text><text x="72" y="435" font-size="23" fill="#b7b5c9" font-weight="400">Reassess cash flow,</text><text x="72" y="467" font-size="23" fill="#b7b5c9" font-weight="400">valuation, and risks.</text><rect x="429" y="316" width="342" height="190" rx="18" fill="#20202e" stroke="#39364c"/><text x="453" y="349" font-size="19" fill="#c4b5fd" font-weight="700">02</text><text x="453" y="391" font-size="27" fill="#f4f1ff" font-weight="700">Portfolio analysis</text><text x="453" y="435" font-size="23" fill="#b7b5c9" font-weight="400">Review concentration</text><text x="453" y="467" font-size="23" fill="#b7b5c9" font-weight="400">and the effect on holdings.</text><rect x="810" y="316" width="342" height="190" rx="18" fill="#20202e" stroke="#39364c"/><text x="834" y="349" font-size="19" fill="#c4b5fd" font-weight="700">03</text><text x="834" y="391" font-size="27" fill="#f4f1ff" font-weight="700">Decision</text><text x="834" y="435" font-size="23" fill="#b7b5c9" font-weight="400">Assess whether the case</text><text x="834" y="467" font-size="23" fill="#b7b5c9" font-weight="400">supports reducing exposure.</text><rect x="48" y="540" width="1104" height="74" rx="14" fill="#302644" stroke="#6f569e"/><text x="70" y="570" font-size="18" fill="#c4b5fd" font-weight="700">RESEARCH BEFORE ACTION</text><text x="70" y="598" font-size="24" fill="#f4f1ff" font-weight="500">The agent connects the new evidence to Marcus’s portfolio and mandate.</text><rect x="48" y="641" width="34" height="4" rx="2" fill="#c4b5fd" stroke="none"/><rect x="94" y="641" width="34" height="4" rx="2" fill="#c4b5fd" stroke="none"/><rect x="140" y="641" width="34" height="4" rx="2" fill="#c4b5fd" stroke="none"/><rect x="186" y="641" width="34" height="4" rx="2" fill="#3a364b" stroke="none"/><rect x="232" y="641" width="34" height="4" rx="2" fill="#3a364b" stroke="none"/><rect x="278" y="641" width="34" height="4" rx="2" fill="#3a364b" stroke="none"/><text x="350" y="650" font-size="18" fill="#b7b5c9" font-weight="400">CONNECT   /   RESEARCH   /   SELECT   /   TRADE   /   MONITOR</text>
</g></svg>