<title id="title">New evidence. The same client in mind.</title><desc id="desc">Illustrative ongoing NBIS research follows capacity, contracts, financing, and cash flow. Dion records an earlier home deposit and lower loss tolerance; GoAI revisits the agreed decision with the updated profile. Illustrative workflow, not a live client record or investment recommendation.</desc>
<metadata>Company research background: https://www.sec.gov/Archives/edgar/data/1513845/000110465926052948/nbis-20251231x20f.htm and https://www.sec.gov/Archives/edgar/data/1513845/000110465926094844/nbis-20260812xex99d1.htm. Client circumstances and downside scenarios are fictional.</metadata>
