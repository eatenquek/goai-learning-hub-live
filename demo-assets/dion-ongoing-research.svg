<text x="48" y="45" font-size="19" fill="#5eead4" font-weight="700">DION / CLIENT ADVISORY</text><text x="925" y="45" font-size="20" fill="#b0c7c2" font-weight="400">Illustrative workflow</text>
<text x="48" y="105" font-size="43" fill="#eefdf9" font-weight="700">New evidence. The same client in mind.</text><text x="48" y="146" font-size="23" fill="#b0c7c2" font-weight="400">Company milestones and changing client needs both shape the next conversation.</text>
