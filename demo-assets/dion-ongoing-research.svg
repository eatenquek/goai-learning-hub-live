<rect x="48" y="210" width="352" height="300" rx="18" fill="#1b2a28" stroke="#36524e"/><text x="70" y="252" font-size="18" fill="#5eead4" font-weight="700">GOAI FOLLOWS</text><text x="70" y="308" font-size="26" fill="#eefdf9" font-weight="700">The NBIS evidence</text><text x="70" y="359" font-size="21" fill="#b0c7c2" font-weight="400">Capacity delivery milestones</text><text x="70" y="395" font-size="21" fill="#b0c7c2" font-weight="400">Customer and contract updates</text><text x="70" y="431" font-size="21" fill="#b0c7c2" font-weight="400">Financing and cash flow</text><text x="70" y="467" font-size="21" fill="#b0c7c2" font-weight="400">The wider AI spending cycle</text><rect x="424" y="210" width="352" height="300" rx="18" fill="#1b2a28" stroke="#36524e"/><text x="446" y="252" font-size="18" fill="#5eead4" font-weight="700">DION RECORDS</text><text x="446" y="308" font-size="26" fill="#eefdf9" font-weight="700">What has changed</text><text x="446" y="359" font-size="21" fill="#b0c7c2" font-weight="400">Home purchase moved forward</text><text x="446" y="395" font-size="21" fill="#b0c7c2" font-weight="400">Deposit now needed in 9 months</text><text x="446" y="431" font-size="21" fill="#b0c7c2" font-weight="400">Lower comfort with losses</text><text x="446" y="467" font-size="21" fill="#b0c7c2" font-weight="400">Updated preferences saved</text><rect x="800" y="210" width="352" height="300" rx="18" fill="#1b2a28" stroke="#36524e"/><text x="822" y="252" font-size="18" fill="#5eead4" font-weight="700">GOAI REASSESSES</text><text x="822" y="308" font-size="26" fill="#eefdf9" font-weight="700">The next decision</text><text x="822" y="359" font-size="21" fill="#b0c7c2" font-weight="400">Revisit NBIS with new evidence</text><text x="822" y="395" font-size="21" fill="#b0c7c2" font-weight="400">Use the updated client profile</text><text x="822" y="431" font-size="21" fill="#b0c7c2" font-weight="400">Check the agreed conditions</text><text x="822" y="467" font-size="21" fill="#