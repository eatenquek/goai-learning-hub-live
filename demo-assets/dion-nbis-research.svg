<title id="title">What has to go right for NBIS?</title><desc id="desc">Illustrative NBIS research questions cover customer contracts, operating capacity, GPU delivery, customer concentration, cash flow, financing, potential dilution, and valuation. These are assessed against the client’s remembered needs. Illustrative workflow, not a live client record or investment recommendation.</desc>
<metadata>Company research background: https://www.sec.gov/Archives/edgar/data/1513845/000110465926052948/nbis-20251231x20f.htm and https://www.sec.gov/Archives/edgar/data/1513845/000110465926094844/nbis-20260812xex99d1.htm. Client circumstances and downside scenarios are fictional.</metadata>
