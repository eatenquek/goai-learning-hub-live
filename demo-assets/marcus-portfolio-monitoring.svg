<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">The research and trading cycle continues.</title><desc id="desc">A continuous research, analysis, trading and monitoring loop sits beside an activity record. Marcus can review the reasoning, adjust the mandate or pause the agent. Illustrative workflow, not a live account.</desc>
<defs><radialGradient id="glow" cx="90%" cy="0%" r="80%"><stop stop-color="#3b285c"/><stop offset="1" stop-color="#12141e"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#glow)"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="48" y="45" font-size="19" fill="#c4b5fd" font-weight="700">MARCUS / PORTFOLIO AGENT</text><text x="925" y="45" font-size="20" fill="#b7b5c9" font-weight="400">Illustrative workflow</text>
<text x="48" y="105" font-size="43" fill="#f4f1ff" font-weight="700">The research and trading cycle continues.</text><text x="48" y="146" font-size="23" fill="#b7b5c9" font-weight="400">The agent monitors, reassesses, and acts when a change is justified.</text>
<path d="M48 174H1152" stroke="#484158"/><rect x="48" y="206" width="530" height="304" rx="18" fill="#20202e" stroke="#39364c"/><rect x="612" y="206" width="540" height="304" rx="18" fill="#20202e" stroke="#39364c"/><text x="74" y="244" font-size="18" fill="#c4b5fd" font-weight="700">CONTINUOUS MANAGEMENT</text><rect x="74" y="270" width="214" height="69" rx="12" fill="#302644" stroke="#665286"/><text x="102" y="313" font-size="28" fill="#f4f1ff" font-weight="600">Research</text><rect x="330" y="270" width="214" height="69" rx="12" fill="#302644" stroke="#665286"/><text x="358" y="313" font-size="28" fill="#f4f1ff" font-weight="600">Analyse</text><rect x="330" y="397" width="214" height="69" rx="12" fill="#302644" stroke="#665286"/><text x="358" y="440" font-size="28" fill="#f4f1ff" font-weight="600">Trade</text><rect x="74" y="397" width="214" height="69" rx="12" fill="#302644" stroke="#665286"/><text x="102" y="440" font-size="28" fill="#f4f1ff" font-weight="600">Monitor</text><path d="M291 305h29m-12 -9 12 9 -12 9" fill="none" stroke="#c4b5fd" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M320 432h-22m12 -9 -12 9 12 9" fill="none" stroke="#c4b5fd" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M438 348L438 387" stroke="#c4b5fd" stroke-width="2"/><path d="M182 388L182 348" stroke="#c4b5fd" stroke-width="2"/><text x="638" y="244" font-size="18" fill="#c4b5fd" font-weight="700">THE ACTIVITY RECORD</text><circle cx="646" cy="292" r="5" fill="#83e3c1"/><text x="665" y="300" font-size="24" fill="#b7b5c9" font-weight="400">Earnings evidence reviewed</text><circle cx="646" cy="346" r="5" fill="#83e3c1"/><text x="665" y="354" font-size="24" fill="#b7b5c9" font-weight="400">Holding A reduced</text><circle cx="646" cy="400" r="5" fill="#83e3c1"/><text x="665" y="408" font-size="24" fill="#b7b5c9" font-weight="400">Selected GoAI Pick added</text><circle cx="646" cy="454" r="5" fill="#83e3c1"/><text x="665" y="462" font-size="24" fill="#b7b5c9" font-weight="400">Updated portfolio under review</text><rect x="48" y="540" width="1104" height="74" rx="14" fill="#302644" stroke="#6f569e"/><text x="70" y="570" font-size="18" fill="#c4b5fd" font-weight="700">MARCUS STAYS IN CONTROL</text><text x="70" y="598" font-size="24" fill="#f4f1ff" font-weight="500">Review the reasoning. Adjust the mandate. Pause the agent when needed.</text><rect x="48" y="641" width="34" height="4" rx="2" fill="#c4b5fd" stroke="none"/><rect x="94" y="641" width="34" height="4" rx="2" fill="#c4b5fd" stroke="none"/><rect x="140" y="641" width="34" height="4" rx="2" fill="#c4b5fd" stroke="none"/><rect x="186" y="641" width="34" height="4" rx="2" fill="#c4b5fd" stroke="none"/><rect x="232" y="641" width="34" height="4" rx="2" fill="#c4b5fd" stroke="none"/><rect x="278" y="641" width="34" height="4" rx="2" fill="#c4b5fd" stroke="none"/><text x="350" y="650" font-size="18" fill="#b7b5c9" font-weight="400">CONNECT   /   RESEARCH   /   SELECT   /   TRADE   /   MONITOR</text>
