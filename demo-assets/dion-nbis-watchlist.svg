<title id="title">An AI opportunity. A portfolio decision.</title><desc id="desc">Illustrative Watchlist review with Nebius (NBIS) as an idea under consideration and NVIDIA and TSMC as existing holdings. Company insights lead to questions about shared AI demand and portfolio concentration. Illustrative workflow, not a live client record or investment recommendation.</desc>
<metadata>Company research background: https://www.sec.gov/Archives/edgar/data/1513845/000110465926052948/nbis-20251231x20f.htm and https://www.sec.gov/Archives/edgar/data/1513845/000110465926094844/nbis-20260812xex99d1.htm. Client circumstances and downside scenarios are fictional.</metadata>
