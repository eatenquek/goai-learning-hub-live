<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">A clear plan. A trade he chooses.</title><desc id="desc">A provided plan defines entry, amount, and exit conditions. Ethan checks his budget, risk, and entry conditions, confirms the order himself, and checks broker execution status. Illustrative workflow using a hypothetical company, not a live account.</desc>
<defs><radialGradient id="glow" cx="90%" cy="0%" r="85%"><stop stop-color="#49391b"/><stop offset="1" stop-color="#161715"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#glow)"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="48" y="45" font-size="19" fill="#fcd34d" font-weight="700">ETHAN / BEGINNER INVESTOR</text><text x="925" y="45" font-size="20" fill="#c7bfac" font-weight="400">Illustrative workflow</text>
<text x="48" y="105" font-size="43" fill="#fff8e8" font-weight="700">A clear plan. A trade he chooses.</text><text x="48" y="146" font-size="23" fill="#c7bfac" font-weight="400">He reviews the details before placing the order himself.</text>
<path d="M48 174H1152" stroke="#494233"/>
<rect x="48" y="206" width="604" height="304" rx="18" fill="#24221d" stroke="#484235"/><rect x="686" y="206" width="466" height="304" rx="18" fill="#30291b" stroke="#806b32"/><text x="74" y="244" font-size="18" fill="#fcd34d" font-weight="700">THE PROVIDED TRADE PLAN</text><text x="74" y="291" font-size="25" fill="#fff8e8" font-weight="600">Entry</text><text x="74" y="321" font-size="23" fill="#c7bfac" font-weight="400">The price or conditions for buying</text><text x="74" y="365" font-size="25" fill="#fff8e8" font-weight="600">Amount</text><text x="74" y="395" font-size="23" fill="#c7bfac" font-weight="400">How much the plan proposes to invest</text><text x="74" y="439" font-size="25" fill="#fff8e8" font-weight="600">Exit conditions</text><text x="74" y="469" font-size="23" fill="#c7bfac" font-weight="400">When to take profit or limit a loss</text><text x="714" y="244" font-size="18" fill="#fcd34d" font-weight="700">ETHAN MAKES THE TRADE</text><rect x="714" y="267" width="34" height="34" rx="17" fill="#443a22" stroke="#806b32"/><text x="725" y="291" font-size="22" fill="#fcd34d" font-weight="700">1</text><text x="764" y="291" font-size="25" fill="#fff8e8" font-weight="600">Check the fit</text><text x="714" y="322" font-size="23" fill="#c7bfac" font-weight="400">Budget, risk, and entry conditions</text><rect x="714" y="341" width="34" height="34" rx="17" fill="#443a22" stroke="#806b32"/><text x="725" y="365" font-size="22" fill="#fcd34d" font-weight="700">2</text><text x="764" y="365" font-size="25" fill="#fff8e8" font-weight="600">Review and confirm</text><text x="714" y="396" font-size="23" fill="#c7bfac" font-weight="400">Ethan submits his own order</text><rect x="714" y="415" width="34" height="34" rx="17" fill="#443a22" stroke="#806b32"/><text x="725" y="439" font-size="22" fill="#fcd34d" font-weight="700">3</text><text x="764" y="439" font-size="25" fill="#fff8e8" font-weight="600">Check execution</text><text x="714" y="470" font-size="23" fill="#c7bfac" font-weight="400">The connected broker reports status</text><rect x="48" y="540" width="1104" height="74" rx="14" fill="#332b18" stroke="#806b32"/><text x="70" y="570" font-size="18" fill="#fcd34d" font-weight="700">HIS PLAN BECOMES ACTION</text><text x="70" y="598" font-size="24" fill="#fff8e8" font-weight="500">He follows the trade plan and confirms the order through GoAI’s broker connection.</text><rect x="48" y="641" width="34" height="4" rx="2" fill="#fcd34d" stroke="none"/><rect x="94" y="641" width="34" height="4" rx="2" fill="#fcd34d" stroke="none"/><rect x="140" y="641" width="34" height="4" rx="2" fill="#fcd34d" stroke="none"/><rect x="186" y="641" width="34" height="4" rx="2" fill="#fcd34d" stroke="none"/><rect x="232" y="641" width="34" height="4" rx="2" fill="#474132" stroke="none"/><rect x="278" y="641" width="34" height="4" rx="2" fill="#474132" stroke="none"/><text x="350" y="650" font-size="18" fill="#c7bfac" font-weight="400">DISCOVER   /   UNDERSTAND   /   TRADE   /   STAY INFORMED</text>
</g></svg>