<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Your portfolio, connected.</title><desc id="desc">A connected brokerage account sends holdings, allocations and cash to the GoAI portfolio agent. Illustrative workflow, not a live account.</desc>
<defs><radialGradient id="glow" cx="90%" cy="0%" r="80%"><stop stop-color="#3b285c"/><stop offset="1" stop-color="#12141e"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#glow)"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="48" y="45" font-size="19" fill="#c4b5fd" font-weight="700">MARCUS / PORTFOLIO AGENT</text><text x="925" y="45" font-size="20" fill="#b7b5c9" font-weight="400">Illustrative workflow</text>
<text x="48" y="105" font-size="43" fill="#f4f1ff" font-weight="700">Your portfolio, connected.</text><text x="48" y="146" font-size="23" fill="#b7b5c9" font-weight="400">Broker connectivity brings holdings, cash, and execution into one workflow.</text>
<path d="M48 174H1152" stroke="#484158"/><rect x="48" y="206" width="462" height="304" rx="18" fill="#20202e" stroke="#39364c"/><rect x="680" y="206" width="472" height="304" rx="18" fill="#262037" stroke="#665286"/><text x="76" y="244" font-size="18" fill="#c4b5fd" font-weight="700">CONNECTED BROKER</text><rect x="329" y="219" width="150" height="35" rx="17" fill="#172b29" stroke="#32544b"/><text x="345" y="243" font-size="19" fill="#83e3c1" font-weight="600">Connected</text><text x="76" y="296" font-size="32" fill="#f4f1ff" font-weight="700">Marcus’s portfolio</text><path d="M76 318H482" stroke="#484158"/><text x="76" y="348" font-size="25" fill="#b7b5c9" font-weight="400">Holdings</text><text x="397" y="348" font-size="23" fill="#83e3c1" font-weight="400">Synced</text><path d="M76 376H482" stroke="#484158"/><text x="76" y="406" font-size="25" fill="#b7b5c9" font-weight="400">Allocations</text><text x="397" y="406" font-size="23" fill="#83e3c1" font-weight="400">Synced</text><path d="M76 434H482" stroke="#484158"/><text x="76" y="464" font-size="25" fill="#b7b5c9" font-weight="400">Available cash</text><text x="397" y="464" font-size="23" fill="#83e3c1" font-weight="400">Synced</text><path d="M548 358h93m-12 -9 12 9 -12 9" fill="none" stroke="#c4b5fd" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="708" y="245" font-size="18" fill="#c4b5fd" font-weight="700">GOAI PORTFOLIO AGENT</text><text x="708" y="296" font-size="32" fill="#f4f1ff" font-weight="700">The full picture</text><circle cx="718" cy="342" r="5" fill="#c4b5fd"/><text x="737" y="350" font-size="25" fill="#b7b5c9" font-weight="400">What he owns</text><circle cx="718" cy="399" r="5" fill="#c4b5fd"/><text x="737" y="407" font-size="25" fill="#b7b5c9" font-weight="400">Where he is exposed</text><circle cx="718" cy="456" r="5" fill="#c4b5fd"/><text x="737" y="464" font-size="25" fill="#b7b5c9" font-weight="400">What the agent can deploy</text><rect x="48" y="540" width="1104" height="74" rx="14" fill="#302644" stroke="#6f569e"/><text x="70" y="570" font-size="18" fill="#c4b5fd" font-weight="700">CONNECTED CONTEXT</text><text x="70" y="598" font-size="24" fill="#f4f1ff" font-weight="500">His existing holdings shape every research and trading decision.</text><rect x="48" y="641" width="34" height="4" rx="2" fill="#c4b5fd" stroke="none"/><rect x="94" y="641" width="34" height="4" rx="2" fill="#3a364b" stroke="none"/><rect x="140" y="641" width="34" height="4" rx="2" fill="#3a364b" stroke="none"/><rect x="186" y="641" width="34" height="4" rx="2" fill="#3a364b" stroke="none"/><rect x="232" y="641" width="34" height="4" rx="2" fill="#3a364b" stroke="none"/><rect x="278" y="641" width="34" height="4" rx="2" fill="#3a364b" stroke="none"/><text x="350" y="650" font-size="18" fill="#b7b5c9" font-weight="400">CONNECT   /   RESEARCH   /   SELECT   /   TRADE   /   MONITOR</text>
</g></svg>