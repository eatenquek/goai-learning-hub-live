<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">A smaller position. Or a reason to wait.</title><desc id="desc">Illustrative draft advice preserves the home deposit and compares a limited NBIS allocation with waiting for clearer evidence. A smaller allocation is only considered if combined downside fits the client’s loss tolerance. Illustrative workflow, not a live client record or investment recommendation.</desc>
<metadata>Company research background: https://www.sec.gov/Archives/edgar/data/1513845/000110465926052948/nbis-20251231x20f.htm and https://www.sec.gov/Archives/edgar/data/1513845/000110465926094844/nbis-20260812xex99d1.htm. Client circumstances and downside scenarios are fictional.</metadata>
<defs><radialGradient id="glow" cx="90%" cy="0%" r="85%"><stop stop-color="#16483e"/><stop offset="1" stop-color="#131b1c"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#glow)"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="48" y="45" font-size="19" fill="#5eead4" font-weight="700">DION / CLIENT ADVISORY</text><text x="925" y="45" font-size="20" fill="#b0c7c2" font-weight="400">Illustrative workflow</text>
<text x="48" y="105" font-size="43" fill="#eefdf9" font-weight="700">A smaller position. Or a reason to wait.</text><text x="48" y="146" font-size="23" fill="#b0c7c2" font-weight="400">Illustrative options depend on the client’s needs and the strength of the evidence.</text>
<path d="M48 174H1152" stroke="#36524e"/>
<rect x="48" y="210" width="352" height="300" rx="18" fill="#1b2a28" stroke="#36524e"/><text x="70" y="252" font-size="17" fill="#5eead4" font-weight="700">BECAUSE CASH IS NEEDED</text><text x="70" y="309" font-size="25" fill="#eefdf9" font-weight="700">Preserve the deposit</text><text x="70" y="370" font-size="22" fill="#b0c7c2" font-weight="400">Keep the home-deposit funds</text><text x="70" y="409" font-size="22" fill="#b0c7c2" font-weight="400">outside the proposed NBIS</text><text x="70" y="448" font-size="22" fill="#b0c7c2" font-weight="400">investment.</text><rect x="424" y="210" width="352" height="300" rx="18" fill="#1b2a28" stroke="#36524e"/><text x="446" y="252" font-size="17" fill="#5eead4" font-weight="700">IF THE DOWNSIDE FITS</text><text x="446" y="309" font-size="25" fill="#eefdf9" font-weight="700">Limit the allocation</text><text x="446" y="370" font-size="22" fill="#b0c7c2" font-weight="400">Evaluate a limited position</text><text x="446" y="409" font-size="22" fill="#b0c7c2" font-weight="400">only within the client’s</text><text x="446" y="448" font-size="22" fill="#b0c7c2" font-weight="400">portfolio loss tolerance.</text><rect x="800" y="210" width="352" height="300" rx="18" fill="#1b2a28" stroke="#36524e"/><text x="822" y="252" font-size="17" fill="#5eead4" font-weight="700">IF THE CASE IS NOT CLEAR</text><text x="822" y="309" font-size="25" fill="#eefdf9" font-weight="700">Wait for evidence</text><text x="822" y="370" font-size="22" fill="#b0c7c2" font-weight="400">Review delivery and funding</text><text x="822" y="409" font-size="22" fill="#b0c7c2" font-weight="400">milestones before revisiting</text><text x="822" y="448" font-size="22" fill="#b0c7c2" font-weight="400">the NBIS decision.</text><rect x="48" y="540" width="1104" height="74" rx="14" fill="#193b35" stroke="#3e8174"/><text x="70" y="570" font-size="18" fill="#5eead4" font-weight="700">PERSONALISED ADVICE, WITH A REASON</text><text x="70" y="598" font-size="24" fill="#eefdf9" font-weight="500">Dion reviews the evidence, discusses the trade-offs, and records the agreed next step.</text><rect x="48" y="641" width="34" height="4" rx="2" fill="#5eead4" stroke="none"/><rect x="94" y="641" width="34" height="4" rx="2" fill="#5eead4" stroke="none"/><rect x="140" y="641" width="34" height="4" rx="2" fill="#5eead4" stroke="none"/><rect x="186" y="641" width="34" height="4" rx="2" fill="#5eead4" stroke="none"/><rect x="232" y="641" width="34" height="4" rx="2" fill="#5eead4" stroke="none"/><rect x="278" y="641" width="34" height="4" rx="2" fill="#344c47" stroke="none"/><text x="350" y="650" font-size="18" fill="#b0c7c2" font-weight="400">REMEMBER   /   RESEARCH   /   PERSONALISE   /   REASSESS</text>
</g></svg>