<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">An opportunity he can understand.</title><desc id="desc">Three cards explain a hypothetical software business, its growth opportunity, and the risk from rising costs. Illustrative workflow using a hypothetical company, not a live account.</desc>
<defs><radialGradient id="glow" cx="90%" cy="0%" r="85%"><stop stop-color="#49391b"/><stop offset="1" stop-color="#161715"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#glow)"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="48" y="45" font-size="19" fill="#fcd34d" font-weight="700">ETHAN / BEGINNER INVESTOR</text><text x="925" y="45" font-size="20" fill="#c7bfac" font-weight="400">Illustrative workflow</text>
<text x="48" y="105" font-size="43" fill="#fff8e8" font-weight="700">An opportunity he can understand.</text><text x="48" y="146" font-size="23" fill="#c7bfac" font-weight="400">An illustrative software company, explained through three simple questions.</text>
<path d="M48 174H1152" stroke="#494233"/>
<rect x="48" y="210" width="352" height="300" rx="18" fill="#24221d" stroke="#484235"/><text x="70" y="252" font-size="18" fill="#fcd34d" font-weight="700">01 / THE BUSINESS</text><text x="70" y="310" font-size="27" fill="#fff8e8" font-weight="700">What does it do?</text><text x="70" y="370" font-size="23" fill="#c7bfac" font-weight="400">Businesses pay to use</text><text x="70" y="408" font-size="23" fill="#c7bfac" font-weight="400">its software through</text><text x="70" y="446" font-size="23" fill="#c7bfac" font-weight="400">a subscription.</text><rect x="424" y="210" width="352" height="300" rx="18" fill="#24221d" stroke="#484235"/><text x="446" y="252" font-size="18" fill="#fcd34d" font-weight="700">02 / THE OPPORTUNITY</text><text x="446" y="310" font-size="27" fill="#fff8e8" font-weight="700">Why could it grow?</text><text x="446" y="370" font-size="23" fill="#c7bfac" font-weight="400">More paying customers</text><text x="446" y="408" font-size="23" fill="#c7bfac" font-weight="400">could help the company</text><text x="446" y="446" font-size="23" fill="#c7bfac" font-weight="400">increase its sales.</text><rect x="800" y="210" width="352" height="300" rx="18" fill="#24221d" stroke="#484235"/><text x="822" y="252" font-size="18" fill="#fcd34d" font-weight="700">03 / THE RISK</text><text x="822" y="310" font-size="27" fill="#fff8e8" font-weight="700">What could go wrong?</text><text x="822" y="370" font-size="23" fill="#c7bfac" font-weight="400">If costs rise too quickly,</text><text x="822" y="408" font-size="23" fill="#c7bfac" font-weight="400">the company could keep</text><text x="822" y="446" font-size="23" fill="#c7bfac" font-weight="400">less of those sales as profit.</text><rect x="48" y="540" width="1104" height="74" rx="14" fill="#332b18" stroke="#806b32"/><text x="70" y="570" font-size="18" fill="#fcd34d" font-weight="700">THE IDEA HE CAN EXPLAIN</text><text x="70" y="598" font-size="24" fill="#fff8e8" font-weight="500">A growing customer base is promising. The cost of that growth matters too.</text><rect x="48" y="641" width="34" height="4" rx="2" fill="#fcd34d" stroke="none"/><rect x="94" y="641" width="34" height="4" rx="2" fill="#fcd34d" stroke="none"/><rect x="140" y="641" width="34" height="4" rx="2" fill="#474132" stroke="none"/><rect x="186" y="641" width="34" height="4" rx="2" fill="#474132" stroke="none"/><rect x="232" y="641" width="34" height="4" rx="2" fill="#474132" stroke="none"/><rect x="278" y="641" width="34" height="4" rx="2" fill="#474132" stroke="none"/><text x="350" y="650" font-size="18" fill="#c7bfac" font-weight="400">DISCOVER   /   UNDERSTAND   /   TRADE   /   STAY INFORMED</text>
</g></svg>