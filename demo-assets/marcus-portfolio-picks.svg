<title id="title">The right opportunity for his portfolio.</title><desc id="desc">Three illustrative candidates are evaluated. Candidate A fits research and portfolio requirements; other candidates duplicate exposure or do not meet the criteria. Illustrative workflow, not a live account.</desc>
