<text x="48" y="105" font-size="43" fill="#f4f1ff" font-weight="700">The right opportunity for his portfolio.</text><text x="48" y="146" font-size="23" fill="#b7b5c9" font-weight="400">GoAI Picks candidates are evaluated against what Marcus already owns.</text>
