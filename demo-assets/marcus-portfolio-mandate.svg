<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">His goals. His rules. His agent.</title><desc id="desc">Marcus defines investment objectives, preferences and trading limits and deploys an agent authorised to research, buy, sell and rebalance. Illustrative workflow, not a live account.</desc>
<defs><radialGradient id="glow" cx="90%" cy="0%" r="80%"><stop stop-color="#3b285c"/><stop offset="1" stop-color="#12141e"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#glow)"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="48" y="45" font-size="19" fill="#c4b5fd" font-weight="700">MARCUS / PORTFOLIO AGENT</text><text x="925" y="45" font-size="20" fill="#b7b5c9" font-weight="400">Illustrative workflow</text>
<text x="48" y="105" font-size="43" fill="#f4f1ff" font-weight="700">His goals. His rules. His agent.</text><text x="48" y="146" font-size="23" fill="#b7b5c9" font-weight="400">A standing mandate guides how the portfolio is managed.</text>
<path d="M48 174H1152" stroke="#484158"/><rect x="48" y="206" width="636" height="304" rx="18" fill="#20202e" stroke="#39364c"/><rect x="716" y="206" width="436" height="304" rx="18" fill="#262037" stroke="#665286"/><text x="76" y="247" font-size="18" fill="#c4b5fd" font-weight="700">MARCUS SETS THE MANDATE</text><text x="76" y="303" font-size="20" fill="#b7b5c9" font-weight="400">Objective</text><text x="245" y="303" font-size="26" fill="#f4f1ff" font-weight="600">Long-term growth</text><text x="76" y="378" font-size="20" fill="#b7b5c9" font-weight="400">Preferences</text><text x="245" y="378" font-size="26" fill="#f4f1ff" font-weight="600">Risk and diversification</text><text x="76" y="453" font-size="20" fill="#b7b5c9" font-weight="400">Boundaries</text><text x="245" y="453" font-size="26" fill="#f4f1ff" font-weight="600">Position and trading limits</text><rect x="744" y="228" width="204" height="35" rx="17" fill="#172b29" stroke="#32544b"/><text x="760" y="252" font-size="19" fill="#83e3c1" font-weight="600">Agent deployed</text><text x="744" y="310" font-size="30" fill="#f4f1ff" font-weight="700">Authorised to act</text><text x="744" y="366" font-size="25" fill="#b7b5c9" font-weight="400">Research the portfolio</text><text x="744" y="418" font-size="25" fill="#b7b5c9" font-weight="400">Buy, sell, and rebalance</text><text x="744" y="470" font-size="25" fill="#b7b5c9" font-weight="400">Stay within his mandate</text><rect x="48" y="540" width="1104" height="74" rx="14" fill="#302644" stroke="#6f569e"/><text x="70" y="570" font-size="18" fill="#c4b5fd" font-weight="700">AUTONOMY, DEFINED</text><text x="70" y="598" font-size="24" fill="#f4f1ff" font-weight="500">Marcus sets the direction. The agent handles ongoing analysis and execution.</text><rect x="48" y="641" width="34" height="4" rx="2" fill="#c4b5fd" stroke="none"/><rect x="94" y="641" width="34" height="4" rx="2" fill="#c4b5fd" stroke="none"/><rect x="140" y="641" width="34" height="4" rx="2" fill="#3a364b" stroke="none"/><rect x="186" y="641" width="34" height="4" rx="2" fill="#3a364b" stroke="none"/><rect x="232" y="641" width="34" height="4" rx="2" fill="#3a364b" stroke="none"/><rect x="278" y="641" width="34" height="4" rx="2" fill="#3a364b" stroke="none"/><text x="350" y="650" font-size="18" fill="#b7b5c9" font-weight="400">CONNECT   /   RESEARCH   /   SELECT   /   TRADE   /   MONITOR</text>
</g></svg>